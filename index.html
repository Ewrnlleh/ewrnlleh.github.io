<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal portfolio website - CLI style">
    <title>Ewrnlleh - Portfolio Terminal</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        #terminal {
            max-width: 900px;
            margin: 0 auto;
        }

        #output {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .output-line {
            margin-bottom: 5px;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            color: #0f0;
            margin-right: 8px;
        }

        #command-input {
            background: transparent;
            border: none;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: inherit;
            outline: none;
            flex: 1;
            caret-color: transparent;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2em;
            background-color: #0f0;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }

        a {
            color: #0ff;
            text-decoration: underline;
        }

        a:hover {
            color: #fff;
        }

        .welcome-text {
            color: #0f0;
        }

        .command-text {
            color: #ff0;
        }

        .error-text {
            color: #f00;
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div id="output"></div>
        <div class="input-line">
            <span class="prompt">visitor@ewrnlleh:~$</span>
            <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
            <span class="cursor"></span>
        </div>
    </div>

    <script>
        const output = document.getElementById('output');
        const input = document.getElementById('command-input');

        const welcomeMessage = `
Welcome to Ewrnlleh's Portfolio Terminal
========================================

Type 'help' to see available commands.
`;

        const commands = {
            help: () => {
                return `
Available commands:
-------------------
  help      - Show this help message
  about     - Learn more about me
  projects  - View my projects
  clear     - Clear the terminal screen
`;
            },
            about: () => {
                return `
About Me
--------
Hi, I'm Ewrnlleh! I'm a passionate developer who loves building
elegant digital experiences with clean code and creative solutions.

I specialize in web development and enjoy tackling complex problems.
When I'm not coding, you'll find me exploring new technologies,
contributing to open source, or working on personal projects.

Skills: JavaScript, Python, TypeScript, React, Node.js, and more.
`;
            },
            projects: () => {
                return `
My Projects
-----------
1. Project Alpha
   A full-stack web application built with React and Node.js.
   <a href="https://github.com/Ewrnlleh/project-alpha" target="_blank" rel="noopener noreferrer">View on GitHub</a>

2. Project Beta
   A Python-based CLI tool for data processing and automation.
   <a href="https://github.com/Ewrnlleh/project-beta" target="_blank" rel="noopener noreferrer">View on GitHub</a>

3. Project Gamma
   A responsive portfolio website with modern design patterns.
   <a href="https://github.com/Ewrnlleh/project-gamma" target="_blank" rel="noopener noreferrer">View on GitHub</a>
`;
            },
            clear: () => {
                output.innerHTML = '';
                return '';
            }
        };

        function printOutput(text, className = '') {
            if (text) {
                const line = document.createElement('div');
                line.className = 'output-line' + (className ? ' ' + className : '');
                line.innerHTML = text;
                output.appendChild(line);
            }
        }

        function processCommand(cmd) {
            const trimmedCmd = cmd.trim().toLowerCase();
            
            printOutput(`<span class="prompt">visitor@ewrnlleh:~$</span> <span class="command-text">${escapeHtml(cmd)}</span>`);
            
            if (trimmedCmd === '') {
                return;
            }
            
            if (commands[trimmedCmd]) {
                const result = commands[trimmedCmd]();
                printOutput(result);
            } else {
                printOutput(`<span class="error-text">Command not found: ${escapeHtml(trimmedCmd)}</span>`);
                printOutput(`Type 'help' to see available commands.`);
            }
            
            window.scrollTo(0, document.body.scrollHeight);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                processCommand(input.value);
                input.value = '';
            }
        });

        document.body.addEventListener('click', () => {
            input.focus();
        });

        printOutput(welcomeMessage, 'welcome-text');
    </script>
</body>
</html>
